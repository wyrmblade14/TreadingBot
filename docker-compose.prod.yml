# ──────────────────────────────────────────────────────────────────────────────
# TreadingBot — Production overrides (Oracle Cloud / any remote server)
#
# Usage:  make prod-up   (first deploy)
#         make prod-deploy  (redeploy after code changes, postgres untouched)
#
# Architecture:
#   Internet → BLOCKED by Oracle VCN (no inbound rules)
#   Your devices (Tailscale) → port 80 on Oracle host
#     └── Nginx → /api/*          → dashboard-api (internal Docker)
#              → /*               → react-dashboard (internal Docker)
#   Postgres — internal Docker network only, never exposed
#   Bot/watchdog — no ports needed
#
# CI/CD:
#   Building on OCI ARM instances can be slow. This project supports
#   GitHub Actions to build images on GitHub and deploy them to OCI.
#   See .github/workflows/deploy.yml
# ──────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    ports: !reset []       # Internal Docker network only — never exposed to host

  bot:
    image: ${BOT_IMAGE:-treadingbot-bot}
    build:
      context: .
      target: bot-runtime
    ports: !reset []
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ~/.oci:/root/.oci:ro

  dashboard-api:
    image: ${API_IMAGE:-treadingbot-api}
    build:
      context: .
      target: bot-runtime
    ports: !reset []
    volumes:
      - ~/.oci:/root/.oci:ro

  react-dashboard:
    image: ${DASH_IMAGE:-treadingbot-dash}
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL:-http://localhost}
    command: node server.js
    ports: !reset []
    volumes: !reset []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL:-http://localhost}
      DASHBOARD_API_INTERNAL_URL: http://dashboard-api:8000

  watchdog:
    image: ${BOT_IMAGE:-treadingbot-bot}
    build:
      context: .
      target: watchdog-runtime

  nginx:
    image: nginx:1.27-alpine
    container_name: treadingbot_nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      react-dashboard:
        condition: service_started
      dashboard-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
