# ──────────────────────────────────────────────────────────────────────────────
# TreadingBot — Production overrides (Oracle Cloud / any remote server)
#
# Usage:  make prod-up   (first deploy)
#         make prod-deploy  (redeploy after code changes, postgres untouched)
#
# Architecture:
#   Internet → BLOCKED by Oracle VCN (no inbound rules)
#   Your devices (Tailscale) → port 80 on Oracle host
#     └── Nginx → /api/*          → dashboard-api (internal Docker)
#              → /*               → react-dashboard (internal Docker)
#   Postgres — internal Docker network only, never exposed
#   Bot/watchdog — no ports needed
#
# Private access via Tailscale:
#   http://<your-tailscale-hostname>   — React dashboard
#   http://<your-tailscale-hostname>/api/health  — API health check
#
# One-time Oracle setup (run on the instance, not locally):
#   curl -fsSL https://tailscale.com/install.sh | sh
#   sudo tailscale up
#   # Then on your laptop/phone: install Tailscale and accept the invite
# ──────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    ports: !reset []       # Internal Docker network only — never exposed to host

  bot:
    ports: !reset []        # Nginx proxies /kite/callback → bot:7777 internally — no direct host port
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env                  # Writable so auto-login can save fresh token
      - ~/.oci:/root/.oci:ro              # OCI CLI config + key — needed for Vault + Object Storage

  dashboard-api:
    ports: !reset []       # Nginx handles external access — no direct host binding
    volumes:
      - ~/.oci:/root/.oci:ro              # OCI CLI config + key — needed for Vault reads

  react-dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runner        # Production Next.js standalone build (not dev server)
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # Set this in .env to your Tailscale hostname or IP, no port needed:
        #   NEXT_PUBLIC_DASHBOARD_API_URL=http://oracle-machine.ts.net
        NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL:-http://localhost}
    command: node server.js
    ports: !reset []        # Nginx handles external access — no direct host binding
    volumes: !reset []      # No source-code hot-reload in prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DASHBOARD_API_URL: ${NEXT_PUBLIC_DASHBOARD_API_URL:-http://localhost}
      DASHBOARD_API_INTERNAL_URL: http://dashboard-api:8000

  nginx:
    image: nginx:1.27-alpine
    container_name: treadingbot_nginx
    ports:
      - "80:80"             # Single public entry point — protected by Tailscale + VCN
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      react-dashboard:
        condition: service_started
      dashboard-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
