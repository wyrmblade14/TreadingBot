name: CI — Build & Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case image names
        run: |
          echo "IMAGE_NAME_BOT=$(echo ${{ github.repository }}-bot | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=$(echo ${{ github.repository }}-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_DASH=$(echo ${{ github.repository }}-dash | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: bot-runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BOT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: bot-runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push React Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          target: runner
          file: ./web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_DASH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_DASHBOARD_API_URL=${{ secrets.NEXT_PUBLIC_DASHBOARD_API_URL }}
