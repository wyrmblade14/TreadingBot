upstream react_dashboard {
    server react-dashboard:3000;
}

upstream dashboard_api {
    server dashboard-api:8000;
}

upstream kite_callback {
    server bot:7777;
}

server {
    listen 80;
    server_name _;

    # ── Kite OAuth callback ───────────────────────────────────────────────────
    # Zerodha redirects the browser here after a successful login.
    # Set your Kite Connect app's Redirect URL to:
    #   http://<tailscale-ip>/kite/callback
    location /kite/callback {
        proxy_pass         http://kite_callback/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── Python JSON API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── React / Next.js Dashboard ─────────────────────────────────────────────
    location / {
        proxy_pass         http://react_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
